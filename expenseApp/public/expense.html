<!DOCTYPE html>
<html>

<head>
    <title>Expense App</title>
    <style>
        body {
            font-family: Arial;
            max-width: 600px;
            margin: auto;
        }

        input,
        button {
            margin: 5px;
            padding: 8px;
        }

        li {
            margin: 10px 0;
            background-color: rgb(187, 238, 240);
            color: rgb(48, 46, 46);
            padding: 10px;
            border-radius: 20px;
        }
        button{
            background-color: rgb(22, 146, 208);
            border: none;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>Expense Tracker App</h1>

    <form id="form">
        <input type="text" id="name" placeholder="Expense Name" required />
        <input type="text" id="amount" placeholder="Expense Amount" required />
        <button type="submit">Submit</button>
    </form>

    <hr>

    <ul id="list"></ul>

    <script src="expense.js"></script>

</body>

</html>
