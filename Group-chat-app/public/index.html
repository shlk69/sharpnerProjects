<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Group chat app</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: "Inter", sans-serif;
        }
    </style>
</head>

<body
    class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 flex items-center justify-center p-4 overflow-hidden">

    <!-- Background Glow -->
    <div class="absolute top-0 left-0 w-60 h-60 bg-purple-500/20 blur-3xl rounded-full"></div>
    <div class="absolute bottom-0 right-0 w-60 h-60 bg-indigo-500/20 blur-3xl rounded-full"></div>

    <!-- Signup Card -->
    <div
        class="relative z-10 w-full max-w-sm backdrop-blur-2xl bg-white/10 border border-white/10 rounded-3xl p-6 shadow-2xl">

        <!-- Heading -->
        <div class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-white mb-2">
                Create Account
            </h1>

        </div>

        <!-- Form -->
        <form class="space-y-4">

            <!-- Name -->
            <div>
                <label class="block text-sm text-slate-300 mb-1.5">
                    Full Name
                </label>

                <input type="text" placeholder="John Doe"
                    class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-slate-400 outline-none transition-all duration-300 focus:ring-2 focus:ring-indigo-500 focus:bg-white/10" />
            </div>

            <!-- Email -->
            <div>
                <label class="block text-sm text-slate-300 mb-1.5">
                    Email
                </label>

                <input type="email" placeholder="john@example.com"
                    class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-slate-400 outline-none transition-all duration-300 focus:ring-2 focus:ring-indigo-500 focus:bg-white/10" />
            </div>

            <!-- Phone -->
            <div>
                <label class="block text-sm text-slate-300 mb-1.5">
                    Phone Number
                </label>

                <input type="tel" placeholder="+91 9876543210"
                    class="w-full px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-slate-400 outline-none transition-all duration-300 focus:ring-2 focus:ring-indigo-500 focus:bg-white/10" />
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm text-slate-300 mb-1.5">
                    Password
                </label>

                <div class="relative">

                    <input id="password" type="password" placeholder="••••••••"
                        class="w-full px-4 py-2.5 pr-12 rounded-xl bg-white/5 border border-white/10 text-white placeholder:text-slate-400 outline-none transition-all duration-300 focus:ring-2 focus:ring-indigo-500 focus:bg-white/10" />

                    <!-- Eye Button -->
                    <button type="button" onclick="togglePassword()"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition">

                        <!-- Eye Icon -->
                        <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke-width="1.8" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>

                        <!-- Eye Slash Icon -->
                        <svg id="eyeClose" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke-width="1.8" stroke="currentColor" class="w-5 h-5 hidden">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18" />
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M10.477 10.488A3 3 0 0012 15a3 3 0 002.523-4.512" />
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M9.88 5.09A9.953 9.953 0 0112 4.5c4.638 0 8.573 3.007 9.963 7.178a1.01 1.01 0 010 .644 10.054 10.054 0 01-4.043 5.11M6.228 6.228A10.05 10.05 0 002.037 11.68a1.01 1.01 0 000 .644c1.353 4.058 5.056 6.99 9.4 7.176" />
                        </svg>

                    </button>

                </div>
            </div>

            <!-- Signup Button -->
            <button
                class="w-full py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold hover:scale-[1.01] transition-all duration-300 shadow-lg shadow-indigo-500/20">
                Create Account
            </button>

            <!-- Divider -->
            <div class="flex items-center gap-3 py-1">
                <div class="flex-1 h-px bg-white/10"></div>

                <span class="text-slate-400 text-xs">
                    OR
                </span>

                <div class="flex-1 h-px bg-white/10"></div>
            </div>

            <!-- Google Button -->
            <button type="button"
                class="w-full flex items-center justify-center gap-3 py-2.5 rounded-xl bg-white text-slate-800 font-medium hover:bg-slate-100 transition-all duration-300">

                <!-- Google Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="w-5 h-5">
                    <path fill="#FFC107"
                        d="M43.611 20.083H42V20H24v8h11.303C33.659 32.657 29.233 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.27 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z" />
                    <path fill="#FF3D00"
                        d="M6.306 14.691l6.571 4.819C14.655 16.108 18.961 13 24 13c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.27 4 24 4 16.318 4 9.656 8.337 6.306 14.691z" />
                    <path fill="#4CAF50"
                        d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.211 0-9.623-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z" />
                    <path fill="#1976D2"
                        d="M43.611 20.083H42V20H24v8h11.303c-1.011 2.964-3.063 5.375-5.784 6.57l.003-.002 6.19 5.238C35.273 39.09 44 34 44 24c0-1.341-.138-2.65-.389-3.917z" />
                </svg>

                Continue with Google
            </button>

        </form>

    </div>
</body>

</html>
