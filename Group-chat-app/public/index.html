<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talksy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: Inter, sans-serif;
        }

        .chat-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .chat-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
        }
    </style>
</head>

<body class="bg-[#0b141a] overflow-hidden">

    <!-- AUTH SECTION -->
    <section id="authContainer" class="min-h-screen flex items-center justify-center px-4 bg-[#0d0d0d]">

        <div class="w-full max-w-sm border border-white/10 bg-[#141414] rounded-2xl px-6 py-8 shadow-2xl">

            <div id="authHeader" class="flex flex-col items-center justify-center mb-6">
                <div
                    class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center mb-4">
                    💬
                </div>
                <h1 id="formTitle" class="text-2xl font-semibold text-white">Create Account</h1>
            </div>

            <!-- SIGNUP -->
            <form id="signupForm" class="space-y-3">
                <input id="name" type="text" placeholder="Full Name"
                    class="w-full h-11 px-4 rounded-xl bg-[#1a1a1a] text-white outline-none">
                <input id="email" type="email" placeholder="Email"
                    class="w-full h-11 px-4 rounded-xl bg-[#1a1a1a] text-white outline-none">
                <input id="number" type="text" placeholder="Phone Number"
                    class="w-full h-11 px-4 rounded-xl bg-[#1a1a1a] text-white outline-none">
                <input id="password" type="password" placeholder="Password"
                    class="w-full h-11 px-4 rounded-xl bg-[#1a1a1a] text-white outline-none">
                <p id="signupError" class="hidden text-sm text-red-500"></p>
                <button type="submit"
                    class="w-full h-11 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white">
                    Create Account
                </button>
                <p class="text-sm text-center text-neutral-400">
                    Already have an account?
                    <button type="button" onclick="switchForm('login')" class="text-indigo-400">Login</button>
                </p>
            </form>

            <!-- LOGIN -->
            <form id="loginForm" class="space-y-3 hidden">
                <input id="emailOrPhone" type="text" placeholder="Email or Phone"
                    class="w-full h-11 px-4 rounded-xl bg-[#1a1a1a] text-white outline-none">
                <input id="loginPassword" type="password" placeholder="Password"
                    class="w-full h-11 px-4 rounded-xl bg-[#1a1a1a] text-white outline-none">
                <p id="loginError" class="hidden text-sm text-red-500"></p>
                <button type="submit"
                    class="w-full h-11 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white">
                    Login
                </button>
                <p class="text-sm text-center text-neutral-400">
                    Don't have an account?
                    <button type="button" onclick="switchForm('signup')" class="text-indigo-400">Signup</button>
                </p>
            </form>

        </div>

    </section>

    <!-- CHAT APP -->
    <section id="chatWindow" class="hidden fixed inset-0 bg-[#0b141a]">

        <div class="h-full flex">

            <!-- SIDEBAR -->
            <aside class="hidden md:flex w-[380px] bg-[#111b21] border-r border-white/5 flex-col">
                <div class="h-16 bg-[#202c33] px-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center text-white font-semibold">
                            JD
                        </div>
                        <div>
                            <h2 class="text-white text-sm">Talksy</h2>
                            <p class="text-xs text-neutral-400">Messages</p>
                        </div>
                    </div>
                    <button onclick="logout()" class="text-sm text-red-400">Logout</button>
                </div>
            </aside>

            <!-- MAIN CHAT -->
            <main class="flex-1 flex flex-col">

                <!-- TOPBAR -->
                <div class="h-16 bg-[#202c33] border-b border-white/5 px-4 flex items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center text-white">
                            JD
                        </div>
                        <div>
                            <h3 class="text-white text-sm">Jane Doe</h3>
                            <p class="text-xs text-green-400">online</p>
                        </div>
                    </div>
                </div>

                <!-- MESSAGES -->
                <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-4 chat-scrollbar">
                    <div class="flex">
                        <div class="bg-[#202c33] text-white text-sm px-4 py-2 rounded-xl">
                            Hey! Welcome to Talksy 👋
                        </div>
                    </div>
                </div>

                <!-- INPUT -->
                <form id="chatForm" class="h-20 bg-[#202c33] border-t border-white/5 px-4 flex items-center gap-3">
                    <input id="chatBox" type="text" placeholder="Type a message"
                        class="flex-1 h-11 rounded-xl bg-[#2a3942] px-4 text-white outline-none">
                    <button id="sendButton" type="submit" class="w-11 h-11 rounded-full bg-indigo-600 text-white">
                        ➤
                    </button>
                </form>

            </main>

        </div>

    </section>

    <script src="./script.js"></script>

</body>

</html>
