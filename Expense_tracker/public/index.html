<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sign-up page -->
    <div class="form-container">
        <div class="form-header">
            <h1 class="form-title">Create Account</h1>
        </div>

        <form id="signupForm">
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" id="name" class="form-input" placeholder="Enter your full name" required />
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" class="form-input" placeholder="you@example.com" required />
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="Create a strong password"
                    required />
            </div>

            <button type="submit" class="signup-btn">Sign Up</button>
        </form>

        <div class="login-link-container">
            <p class="login-text">
                Already have an account?
                <span class="login-link" onclick="handleLoginClick()">
                    Login
                </span>
            </p>
        </div>
    </div>



    <!-- login-page -->

    <div class="login-wrapper"  >
        <div class="login-card">
            <h1>Login</h1>
    
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="emailLogin" placeholder="you@example.com" required>
                </div>
    
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="passwordLogin" placeholder="Enter your password" required>
                </div>
                <span class="error"></span>
    
                <button type="submit"   class="submit-btn">Login</button>
            </form>
    
            <div class="footer-link">
                <p class="signup-text">
                    Don't have an account?
                    <span class="signup-link" onclick="handleSignupClick()">Sign-up</span>
                </p>
            </div>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
